syntax = "proto3";

package voice_control;

service CommandController {
    rpc ProcessIntents (ProcessIntentsRequest) returns (ServerReply);
}

message Intent {
    string name = 1;
    map<string, string> slots = 2;
    int32 priority = 3;
    string depends_on = 4;
    int64 timeout_ms = 5;
}

message ProcessIntentsRequest {
    repeated Intent intents = 1;
    ExecutionMode mode = 2;
    bool rollback_on_error = 3;
}

enum ExecutionMode {
    SEQUENTIAL = 0;
    PARALLEL = 1;
    ADAPTIVE = 2;
}

message IntentResult {
    string intent_name = 1;
    bool success = 2;
    string error_message = 3;
    int64 execution_time_ms = 4;
}

message ServerReply {
    string message = 1;
    bool success = 2;
    repeated IntentResult results = 3;
    int64 total_time_ms = 4;
}